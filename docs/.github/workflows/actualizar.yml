name: Actualizar encuestas

on:
  schedule:
    - cron: "0 6 * * *"   # cada día a las 06:00 UTC (07:00 en Madrid)
  workflow_dispatch:       # permite lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy lxml beautifulsoup4 html5lib requests nbconvert ipykernel

      - name: Ejecutar el notebook
        run: >
          jupyter nbconvert --to notebook --execute notebook.ipynb
          --output-dir /tmp --output ejecutado.ipynb
          --ExecutePreprocessor.timeout=1800

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Actualización automática $(date -u +%F)"
          git push
